version: "1.0"
orchestration:
  pipeline: "multi-agent-linux-desktop"
  lead_orchestrator:
    name: "Lead Orchestrator"
    description: "Autonomous coordinator dynamically allocating reasoning budgets across specialist subagents."

mcp:
  servers:
    chrome-devtools:
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-chrome-devtools"]
    playwright:
      command: "npx"
      args: ["-y", "@executeautomation/playwright-mcp-server"]

tools:
  - name: "dispatch_subtask"
    description: "Dispatches a subtask to a specialized agent with a specified dynamic reasoning budget."
    parameters:
      type: "object"
      required:
        - "target_agent"
        - "instruction"
        - "thinking_level"
      properties:
        target_agent:
          type: "string"
          enum: ["gui_builder", "code_checker", "qa_tester"]
          description: "The designated specialist subagent for the task."
        instruction:
          type: "string"
          description: "Detailed actionable instructions for the target agent."
        thinking_level:
          type: "string"
          enum: ["low", "medium", "high"]
          description: "Dynamic reasoning budget assigned to the subagent to balance latency and cognitive rigor."

agents:
  gui_builder:
    path: ".antigravity/agents/gui_builder.md"
    default_thinking_level: "medium"
  code_checker:
    path: ".antigravity/agents/code_checker.md"
    default_thinking_level: "high"
  qa_tester:
    path: "personas/05_qa_tester.md"
    default_thinking_level: "high"
    mcp_servers:
      - "chrome-devtools"
      - "playwright"
    skills:
      - "headless-qa-automation"
      - "playwright-automation"
      - "chrome-devtools"
